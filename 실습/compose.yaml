name: kafka-field-guide
x-kafka-common: &kafka-common
  image: apache/kafka:4.3.1
  healthcheck:
    test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 24
    start_period: 20s
  stop_grace_period: 30s
services:
  kafka:
    <<: *kafka-common
    profiles: [single]
    ports: ["127.0.0.1:19092:19092"]
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: ["single-data:/var/lib/kafka/data"]
  kafka1:
    <<: *kafka-common
    profiles: [cluster]
    ports: ["127.0.0.1:29092:19092"]
    environment: &cluster-env
      CLUSTER_ID: QWxwaGFLYWZrYVN0dWR5MQ
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: ["cluster1-data:/var/lib/kafka/data"]
  kafka2:
    <<: *kafka-common
    profiles: [cluster]
    ports: ["127.0.0.1:39092:19092"]
    environment:
      <<: *cluster-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:9092,EXTERNAL://localhost:39092
    volumes: ["cluster2-data:/var/lib/kafka/data"]
  kafka3:
    <<: *kafka-common
    profiles: [cluster]
    ports: ["127.0.0.1:49092:19092"]
    environment:
      <<: *cluster-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:9092,EXTERNAL://localhost:49092
    volumes: ["cluster3-data:/var/lib/kafka/data"]
  postgres:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_USER: study
      POSTGRES_PASSWORD: study-local-only
      POSTGRES_DB: kafka_study
    ports: ["127.0.0.1:15432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./공통/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U study -d kafka_study"]
      interval: 5s
      timeout: 5s
      retries: 20
  build:
    image: maven:3.9.9-eclipse-temurin-21
    profiles: [tools]
    working_dir: /work
    volumes: [".:/work", "maven-cache:/root/.m2"]
    entrypoint: [mvn]
    command: [-B, -q, -DskipTests, package]
  cli:
    image: eclipse-temurin:21-jre
    profiles: [tools]
    working_dir: /work
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      JDBC_URL: jdbc:postgresql://postgres:5432/kafka_study
      JDBC_USER: study
      JDBC_PASSWORD: study-local-only
      STATE_DIR: /state
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8 -Dorg.slf4j.simpleLogger.defaultLogLevel=warn
    volumes: [".:/work:ro", "streams-state:/state"]
    entrypoint: [java, -jar, /work/target/kafka-labs.jar]
volumes:
  single-data:
  cluster1-data:
  cluster2-data:
  cluster3-data:
  pg-data:
  maven-cache:
  streams-state:
