<svg xmlns="http://www.w3.org/2000/svg" width="920" height="410" viewBox="0 0 920 410" role="img" aria-labelledby="title desc"><title id="title">이벤트와 Kafka의 구조 데이터 흐름</title><desc id="desc">주문 서비스 → orders 토픽 → 알림 서비스 → 통계 서비스. 쇼핑몰에서 주문 order-001이 생성되면 주문 서비스는 ORDER_CREATED 이벤트 한 건을 orders 토픽에 기록합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#758c80" stroke-width="1.5"/></marker><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dfe7dc"/></pattern></defs><rect width="920" height="410" fill="#f4f7ef"/><rect width="920" height="410" fill="url(#dots)"/><path d="M265 178.0 C302.5 178.0 302.5 178.0 340 178.0" fill="none" stroke="#8b9e8c" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="266.5" y="152.0" width="72" height="20" rx="4" fill="#f4f7ef"/><text x="302.5" y="166.0" text-anchor="middle" font-size="10" fill="#637c6a" font-family="Segoe UI,Malgun Gothic,sans-serif">전송 / ack</text><path d="M565 178.0 C607.5 178.0 607.5 78.0 650 78.0" fill="none" stroke="#8b9e8c" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="583.5" y="102.0" width="48" height="20" rx="4" fill="#f4f7ef"/><text x="607.5" y="116.0" text-anchor="middle" font-size="10" fill="#637c6a" font-family="Segoe UI,Malgun Gothic,sans-serif">독립 구독</text><path d="M565 178.0 C607.5 178.0 607.5 278.0 650 278.0" fill="none" stroke="#8b9e8c" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="583.5" y="202.0" width="48" height="20" rx="4" fill="#f4f7ef"/><text x="607.5" y="216.0" text-anchor="middle" font-size="10" fill="#637c6a" font-family="Segoe UI,Malgun Gothic,sans-serif">독립 구독</text><g><rect x="40" y="140" width="225" height="76" rx="11" fill="#182c30" stroke="#cbd8c6"/><circle cx="61" cy="163" r="10" fill="#e8eed8"/><text x="61" y="167" text-anchor="middle" font-size="10" fill="#587046" font-family="Consolas,monospace">1</text><text x="80" y="168" fill="#fff" font-weight="600" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">주문 서비스</text><text x="60" y="195" fill="#b2c6bb" font-size="11" font-family="Segoe UI,Malgun Gothic,sans-serif">Producer · 사실 발행</text></g><g><rect x="340" y="140" width="225" height="76" rx="11" fill="#fff" stroke="#cbd8c6"/><circle cx="361" cy="163" r="10" fill="#e8eed8"/><text x="361" y="167" text-anchor="middle" font-size="10" fill="#587046" font-family="Consolas,monospace">2</text><text x="380" y="168" fill="#223e3b" font-weight="600" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">orders 토픽</text><text x="360" y="195" fill="#6f8176" font-size="11" font-family="Segoe UI,Malgun Gothic,sans-serif">Broker · 로그에 저장</text></g><g><rect x="650" y="40" width="225" height="76" rx="11" fill="#fff" stroke="#cbd8c6"/><circle cx="671" cy="63" r="10" fill="#e8eed8"/><text x="671" y="67" text-anchor="middle" font-size="10" fill="#587046" font-family="Consolas,monospace">3</text><text x="690" y="68" fill="#223e3b" font-weight="600" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">알림 서비스</text><text x="670" y="95" fill="#6f8176" font-size="11" font-family="Segoe UI,Malgun Gothic,sans-serif">Group: notification</text></g><g><rect x="650" y="240" width="225" height="76" rx="11" fill="#fff" stroke="#cbd8c6"/><circle cx="671" cy="263" r="10" fill="#e8eed8"/><text x="671" y="267" text-anchor="middle" font-size="10" fill="#587046" font-family="Consolas,monospace">4</text><text x="690" y="268" fill="#223e3b" font-weight="600" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">통계 서비스</text><text x="670" y="295" fill="#6f8176" font-size="11" font-family="Segoe UI,Malgun Gothic,sans-serif">Group: analytics</text></g><text x="885" y="396" text-anchor="end" fill="#879587" font-family="Consolas,monospace" font-size="9">KAFKA FIELD GUIDE / CONCEPTUAL FLOW</text></svg>