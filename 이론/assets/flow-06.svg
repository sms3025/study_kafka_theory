<svg xmlns="http://www.w3.org/2000/svg" width="920" height="410" viewBox="0 0 920 410" role="img" aria-labelledby="title desc"><title id="title">DB 트랜잭션과 업무 멱등성 데이터 흐름</title><desc id="desc">Consumer → UNIQUE 표식 → 금액 집계 → DB COMMIT → Kafka COMMIT. evt-001의 10,000원을 합계에 반영하고 DB 커밋한 뒤 종료합니다. 재시작해 evt-001을 다시 읽더라도 INSERT가 0건을 반환하므로 합계를 다시 올리지 않습니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#758c80" stroke-width="1.5"/></marker><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dfe7dc"/></pattern></defs><rect width="920" height="410" fill="#f4f7ef"/><rect width="920" height="410" fill="url(#dots)"/><path d="M255 178.0 C292.5 178.0 292.5 73.0 330 73.0" fill="none" stroke="#8b9e8c" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="256.5" y="99.5" width="72" height="20" rx="4" fill="#f4f7ef"/><text x="292.5" y="113.5" text-anchor="middle" font-size="10" fill="#637c6a" font-family="Segoe UI,Malgun Gothic,sans-serif">DB BEGIN</text><path d="M555 73.0 C602.5 73.0 602.5 73.0 650 73.0" fill="none" stroke="#8b9e8c" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="548.5" y="47.0" width="108" height="20" rx="4" fill="#f4f7ef"/><text x="602.5" y="61.0" text-anchor="middle" font-size="10" fill="#637c6a" font-family="Segoe UI,Malgun Gothic,sans-serif">inserted = 1</text><path d="M762.5 111 C762.5 178.0 762.5 178.0 762.5 245" fill="none" stroke="#8b9e8c" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M555 73.0 C602.5 73.0 602.5 283.0 650 283.0" fill="none" stroke="#8b9e8c" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="566.5" y="152.0" width="72" height="20" rx="4" fill="#f4f7ef"/><text x="602.5" y="166.0" text-anchor="middle" font-size="10" fill="#637c6a" font-family="Segoe UI,Malgun Gothic,sans-serif">중복이면 건너뜀</text><path d="M650 283.0 C452.5 283.0 452.5 323.0 255 323.0" fill="none" stroke="#8b9e8c" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="428.5" y="277.0" width="48" height="20" rx="4" fill="#f4f7ef"/><text x="452.5" y="291.0" text-anchor="middle" font-size="10" fill="#637c6a" font-family="Segoe UI,Malgun Gothic,sans-serif">별도 커밋</text><g><rect x="30" y="140" width="225" height="76" rx="11" fill="#182c30" stroke="#cbd8c6"/><circle cx="51" cy="163" r="10" fill="#e8eed8"/><text x="51" y="167" text-anchor="middle" font-size="10" fill="#587046" font-family="Consolas,monospace">1</text><text x="70" y="168" fill="#fff" font-weight="600" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Consumer</text><text x="50" y="195" fill="#b2c6bb" font-size="11" font-family="Segoe UI,Malgun Gothic,sans-serif">eventId로 처리</text></g><g><rect x="330" y="35" width="225" height="76" rx="11" fill="#fff" stroke="#cbd8c6"/><circle cx="351" cy="58" r="10" fill="#e8eed8"/><text x="351" y="62" text-anchor="middle" font-size="10" fill="#587046" font-family="Consolas,monospace">2</text><text x="370" y="63" fill="#223e3b" font-weight="600" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">UNIQUE 표식</text><text x="350" y="90" fill="#6f8176" font-size="11" font-family="Segoe UI,Malgun Gothic,sans-serif">handler + event_id</text></g><g><rect x="650" y="35" width="225" height="76" rx="11" fill="#fff" stroke="#cbd8c6"/><circle cx="671" cy="58" r="10" fill="#e8eed8"/><text x="671" y="62" text-anchor="middle" font-size="10" fill="#587046" font-family="Consolas,monospace">3</text><text x="690" y="63" fill="#223e3b" font-weight="600" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">금액 집계</text><text x="670" y="90" fill="#6f8176" font-size="11" font-family="Segoe UI,Malgun Gothic,sans-serif">첫 처리일 때만 갱신</text></g><g><rect x="650" y="245" width="225" height="76" rx="11" fill="#fff" stroke="#cbd8c6"/><circle cx="671" cy="268" r="10" fill="#e8eed8"/><text x="671" y="272" text-anchor="middle" font-size="10" fill="#587046" font-family="Consolas,monospace">4</text><text x="690" y="273" fill="#223e3b" font-weight="600" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">DB COMMIT</text><text x="670" y="300" fill="#6f8176" font-size="11" font-family="Segoe UI,Malgun Gothic,sans-serif">표식 + 금액을 함께 저장</text></g><g><rect x="30" y="285" width="225" height="76" rx="11" fill="#fff" stroke="#cbd8c6"/><circle cx="51" cy="308" r="10" fill="#e8eed8"/><text x="51" y="312" text-anchor="middle" font-size="10" fill="#587046" font-family="Consolas,monospace">5</text><text x="70" y="313" fill="#223e3b" font-weight="600" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Kafka COMMIT</text><text x="50" y="340" fill="#6f8176" font-size="11" font-family="Segoe UI,Malgun Gothic,sans-serif">DB 성공 이후</text></g><text x="885" y="396" text-anchor="end" fill="#879587" font-family="Consolas,monospace" font-size="9">KAFKA FIELD GUIDE / CONCEPTUAL FLOW</text></svg>