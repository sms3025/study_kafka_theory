<svg xmlns="http://www.w3.org/2000/svg" width="920" height="410" viewBox="0 0 920 410" role="img" aria-labelledby="title desc"><title id="title">Replication · ISR · KRaft 데이터 흐름</title><desc id="desc">Producer → Leader → Follower B → Follower C → Controller quorum. orders의 특정 파티션 Leader가 kafka1이라면 kafka1을 중단하고 새 Leader와 ISR을 확인합니다. 모든 파티션이 kafka1을 Leader로 쓰는 것은 아니므로 실제 describe 결과에 따라 중단 노드를 고릅니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#758c80" stroke-width="1.5"/></marker><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dfe7dc"/></pattern></defs><rect width="920" height="410" fill="#f4f7ef"/><rect width="920" height="410" fill="url(#dots)"/><path d="M255 178.0 C292.5 178.0 292.5 178.0 330 178.0" fill="none" stroke="#8b9e8c" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="243.0" y="152.0" width="99" height="20" rx="4" fill="#f4f7ef"/><text x="292.5" y="166.0" text-anchor="middle" font-size="10" fill="#637c6a" font-family="Segoe UI,Malgun Gothic,sans-serif">write / ack</text><path d="M555 178.0 C602.5 178.0 602.5 73.0 650 73.0" fill="none" stroke="#8b9e8c" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="562.0" y="99.5" width="81" height="20" rx="4" fill="#f4f7ef"/><text x="602.5" y="113.5" text-anchor="middle" font-size="10" fill="#637c6a" font-family="Segoe UI,Malgun Gothic,sans-serif">replicate</text><path d="M555 178.0 C602.5 178.0 602.5 283.0 650 283.0" fill="none" stroke="#8b9e8c" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="562.0" y="204.5" width="81" height="20" rx="4" fill="#f4f7ef"/><text x="602.5" y="218.5" text-anchor="middle" font-size="10" fill="#637c6a" font-family="Segoe UI,Malgun Gothic,sans-serif">replicate</text><path d="M255 328.0 C292.5 328.0 292.5 178.0 330 178.0" fill="none" stroke="#8b9e8c" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="268.5" y="227.0" width="48" height="20" rx="4" fill="#f4f7ef"/><text x="292.5" y="241.0" text-anchor="middle" font-size="10" fill="#637c6a" font-family="Segoe UI,Malgun Gothic,sans-serif">리더 관리</text><g><rect x="30" y="140" width="225" height="76" rx="11" fill="#182c30" stroke="#cbd8c6"/><circle cx="51" cy="163" r="10" fill="#e8eed8"/><text x="51" y="167" text-anchor="middle" font-size="10" fill="#587046" font-family="Consolas,monospace">1</text><text x="70" y="168" fill="#fff" font-weight="600" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Producer</text><text x="50" y="195" fill="#b2c6bb" font-size="11" font-family="Segoe UI,Malgun Gothic,sans-serif">acks = all</text></g><g><rect x="330" y="140" width="225" height="76" rx="11" fill="#fff" stroke="#cbd8c6"/><circle cx="351" cy="163" r="10" fill="#e8eed8"/><text x="351" y="167" text-anchor="middle" font-size="10" fill="#587046" font-family="Consolas,monospace">2</text><text x="370" y="168" fill="#223e3b" font-weight="600" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Leader</text><text x="350" y="195" fill="#6f8176" font-size="11" font-family="Segoe UI,Malgun Gothic,sans-serif">ISR 중 1개</text></g><g><rect x="650" y="35" width="225" height="76" rx="11" fill="#fff" stroke="#cbd8c6"/><circle cx="671" cy="58" r="10" fill="#e8eed8"/><text x="671" y="62" text-anchor="middle" font-size="10" fill="#587046" font-family="Consolas,monospace">3</text><text x="690" y="63" fill="#223e3b" font-weight="600" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Follower B</text><text x="670" y="90" fill="#6f8176" font-size="11" font-family="Segoe UI,Malgun Gothic,sans-serif">동기화 복제</text></g><g><rect x="650" y="245" width="225" height="76" rx="11" fill="#fff" stroke="#cbd8c6"/><circle cx="671" cy="268" r="10" fill="#e8eed8"/><text x="671" y="272" text-anchor="middle" font-size="10" fill="#587046" font-family="Consolas,monospace">4</text><text x="690" y="273" fill="#223e3b" font-w