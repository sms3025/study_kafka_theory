<svg xmlns="http://www.w3.org/2000/svg" width="920" height="410" viewBox="0 0 920 410" role="img" aria-labelledby="title desc"><title id="title">제한된 재시도 · DLT 데이터 흐름</title><desc id="desc">orders.retry → 분류 / 처리 → 일시 실패 → 영구 / 소진 실패 → orders.dlt. 잘못된 JSON 때문에 파티션 처리가 계속 막히는 대신, 실패 정보를 orders.dlt에 남기고 후속 레코드를 처리합니다. 복구 담당자는 원인 수정 후 원본 eventId를 유지하여 재발행하고 결과를 확인합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#758c80" stroke-width="1.5"/></marker><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dfe7dc"/></pattern></defs><rect width="920" height="410" fill="#f4f7ef"/><rect width="920" height="410" fill="url(#dots)"/><path d="M255 178.0 C292.5 178.0 292.5 178.0 330 178.0" fill="none" stroke="#8b9e8c" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M555 178.0 C602.5 178.0 602.5 63.0 650 63.0" fill="none" stroke="#8b9e8c" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="578.5" y="94.5" width="48" height="20" rx="4" fill="#f4f7ef"/><text x="602.5" y="108.5" text-anchor="middle" font-size="10" fill="#637c6a" font-family="Segoe UI,Malgun Gothic,sans-serif">retry</text><path d="M650 63.0 C602.5 63.0 602.5 178.0 555 178.0" fill="none" stroke="#8b9e8c" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="578.5" y="94.5" width="48" height="20" rx="4" fill="#f4f7ef"/><text x="602.5" y="108.5" text-anchor="middle" font-size="10" fill="#637c6a" font-family="Segoe UI,Malgun Gothic,sans-serif">재시도</text><path d="M555 178.0 C602.5 178.0 602.5 298.0 650 298.0" fill="none" stroke="#8b9e8c" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="578.5" y="212.0" width="48" height="20" rx="4" fill="#f4f7ef"/><text x="602.5" y="226.0" text-anchor="middle" font-size="10" fill="#637c6a" font-family="Segoe UI,Malgun Gothic,sans-serif">검증 실패</text><path d="M650 298.0 C602.5 298.0 602.5 323.0 555 32