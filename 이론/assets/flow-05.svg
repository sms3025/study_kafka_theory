<svg xmlns="http://www.w3.org/2000/svg" width="920" height="410" viewBox="0 0 920 410" role="img" aria-labelledby="title desc"><title id="title">수동 커밋과 전달 보장 데이터 흐름</title><desc id="desc">poll → 업무 처리 → offset commit → 실패 구간 A → 실패 구간 B. 알림 Consumer가 주문 이벤트를 읽고 고객에게 문자를 보낸다고 해 봅시다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#758c80" stroke-width="1.5"/></marker><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dfe7dc"/></pattern></defs><rect width="920" height="410" fill="#f4f7ef"/><rect width="920" height="410" fill="url(#dots)"/><path d="M255 178.0 C292.5 178.0 292.5 178.0 330 178.0" fill="none" stroke="#8b9e8c" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="268.5" y="152.0" width="48" height="20" rx="4" fill="#f4f7ef"/><text x="292.5" y="166.0" text-anchor="middle" font-size="10" fill="#637c6a" font-family="Segoe UI,Malgun Gothic,sans-serif">처리</text><path d="M555 178.0 C602.5 178.0 602.5 178.0 650 178.0" fill="none" stroke="#8b9e8c" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="571.0" y="152.0" width="63" height="20" rx="4" fill="#f4f7ef"/><text x="602.5" y="166.0" text-anchor="middle" font-size="10" fill="#637c6a" font-family="Segoe UI,Malgun Gothic,sans-serif">성공 후 커밋</text><path d="M142.5 216 C142.5 250.5 142.5 250.5 142.5 285" fill="none" stroke="#8b9e8c" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="111.0" y="224.5" width="63" height="20" rx="4" fill="#f4f7ef"/><text x="142.5" y="238.5" text-anchor="middle" font-size="10" fill="#637c6a" font-family="Segoe UI,Malgun Gothic,sans-serif">잘못된 선커밋</text><path d="M555 178.0 C602.5 178.0 602.5 323.0 650 323.0" fill="none" stroke="#8b9e8c" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="578.5" y="224.5" width="48" height="20" rx="4" fill="#f4f7ef"/><text x="602.5" y="238.5" text-anchor="middle" font-size="10" fill="#637c6a" font-family="Segoe UI,Malgun Gothic,sans-serif">이때 장애</text><g><rect x="30" y="140" width="225" height="76" rx="11" fill="#182c30" stroke="#cbd8c6"/><circle cx="51" cy="163" r="10" fill="#e8eed8"/><text x="51" y="167" text-anchor="middle" font-size="10" fill="#587046" font-family="Consolas,monospace">1</text><text x="70" y="168" fill="#fff" font-weight="600" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">poll</text><text x="50" y="195" fill="#b2c6bb" font-size="11" font-family="Segoe UI,Malgun Gothic,sans-serif">로컬 position 이동</text></g><g><rect x="330" y="140" width="225" height="76" rx="11" fill="#fff" stroke="#cbd8c6"/><circle cx="351" cy="163" r="10" fill="#e8eed8"/><text x="351" y="167" text-anchor="middle" font-size="10" fill="#587046" font-family="Consolas,monospace">2</text><text x="370" y="168" fill="#223e3b" font-weight="600" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">업무 처리</text><text x="350" y="195" fill="#6f8176" font-size="11" font-family="Segoe UI,Malgun Gothic,sans-serif">DB / 외부 호출</text></g><g><rect x="650" y="140" width="225" height="76" rx="11" fill="#fff" stroke="#cbd8c6"/><circle cx="671" cy="163" r="10" fill="#e8eed8"/><text x="671" y="167" text-anchor="middle" font-size="10" fill="#587046" font-family="Consolas,monospace">3</text><text x="690" y="168" fill="#223e3b" font-weight="600" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">offset commit</text><text x="670" y="195" fill="#6f8176" font-size="11" font-family="Segoe UI,Malgun Gothic,sans-serif">다음 읽을 위치 저장</text></g><g><rect x="30" y="285" width="225" height="76" rx="11" fill="#fff" stroke="#cbd8c6"/><circle cx="51" cy="308" r="10" fill="#e8eed8"/><text x="51" y="312" text-anchor="middle" font-size="10" fill="#587046" font-family="Consolas,monospace">4</text><text x="70" y="313" fill="#223e3b" font-weight="600" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">실패 구간 A</text><text x="50" y="340" fill="#6