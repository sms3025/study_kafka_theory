<svg xmlns="http://www.w3.org/2000/svg" width="920" height="410" viewBox="0 0 920 410" role="img" aria-labelledby="title desc"><title id="title">Producer · Consumer API 데이터 흐름</title><desc id="desc">OrderEvent → Serializer / Buffer → Broker Leader → 업무 처리 → Deserializer → Consumer poll. 주문 생성 함수가 반환된 시점과 Kafka 전송 ack를 받은 시점을 각각 로그로 기록한다고 생각해 보세요. 이벤트 발행 실패를 무시하면 API는 성공했는데 후속 처리는 시작되지 않는 상황이 발생할 수 있습니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#758c80" stroke-width="1.5"/></marker><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dfe7dc"/></pattern></defs><rect width="920" height="410" fill="#f4f7ef"/><rect width="920" height="410" fill="url(#dots)"/><path d="M250 93.0 C290.0 93.0 290.0 93.0 330 93.0" fill="none" stroke="#8b9e8c" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="249.5" y="67.0" width="81" height="20" rx="4" fill="#f4f7ef"/><text x="290.0" y="81.0" text-anchor="middle" font-size="10" fill="#637c6a" font-family="Segoe UI,Malgun Gothic,sans-serif">serialize</text><path d="M555 93.0 C602.5 93.0 602.5 93.0 650 93.0" fill="none" stroke="#8b9e8c" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="578.5" y="67.0" width="48" height="20" rx="4" fill="#f4f7ef"/><text x="602.5" y="81.0" text-anchor="middle" font-size="10" fill="#637c6a" font-family="Segoe UI,Malgun Gothic,sans-serif">send</text><path d="M762.5 131 C762.5 190.5 762.5 190.5 762.5 250" fill="none" stroke="#8b9e8c" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="738.5" y="164.5" width="48" height="20" rx="4" fill="#f4f7ef"/><text x="762.5" y="178.5" text-anchor="middle" font-size="10" fill="#637c6a" font-family="Segoe UI,Malgun Gothic,sans-serif">fetch</text><path d="M650 288.0 C602.5 288.0 602.5 288.0 555 288.0" fill="none" stroke="#8b9e8c" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M330 288.0 C290.0 288.0 290.0 288.0 250 288.0" fill="none" stroke="#8b9e8c" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="266.0" y="262.0" width="48" height="20" rx="4" fill="#f4f7ef"/><text x="290.0" y="276.0" text-anchor="middle" font-size="10" fill="#637c6a" font-family="Segoe UI,Malgun Gothic,sans-serif">parse</text><g><rect x="25" y="55" width="225" height="76" rx="11" fill="#182c30" stroke="#cbd8c6"/><circle cx="46" cy="78" r="10" fill="#e8eed8"/><text x="46" y="82" text-anchor="middle" font-size="10" fill="#587046" font-family="Consolas,monospace">1</text><text x="65" y="83" fill="#fff" font-weight="600" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">OrderEvent</text><text x="45" y="110" fill="#b2c6bb" font-size="11" font-family="Segoe UI,Malgun Gothic,sans-serif">Java record → JSON</text></g><g><rect x="330" y="55" width="225" height="76" rx="11" fill="#fff" stroke="#cbd8c6"/><circle cx="351" cy="78" r="10" fill="#e8eed8"/><text x="351" y="82" text-anchor="middle" font-size="10" fill="#587046" font-family="Consolas,monospace">2</text><text x="370" y="83" fill="#223e3b" font-weight="600" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Serializer / Buffer</text><text x="350" y="110" fill="#6f8176" font-size="11" font-family="Segoe UI,Malgun Gothic,sans-serif">바이트 변환 · 배치</text></g><g><rect x="650" y="55" width="225" height="76" rx="11" fill="#fff" stroke="#cbd8c6"/><circle cx="671" cy="78" r="10" fill="#e8eed8"/><text x="671" y="82" text-anchor="middle" font-size="10" fill="#587046" font-family="Consolas,monospace">3</text><text x="690" y="83" fill="#223e3b" font-weight="600" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Broker Leader</text><text x="670" y="110" fill="#6f8176" font-size="11" font-family="Segoe UI,Malgun Gothic,sans-serif">로그 기록 · ack</text></g><g><rect x="25" y="250" width="225" height="76" rx="11" fill="#fff" stroke="#cbd8c6"/><circle cx="46" cy="273" r="10" fill="#e8eed8"/><text x="46" y="277" text-anchor="middle" font-size="10" fill="#587046" font-family="Consolas,monospace">4</text><text x="65" y="278" fill="#223e3b" font-weight="600" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">업무 처리</text><text x="45" y="305" fill="#6f8176" font-size="11" font-family="Segoe UI,Malgun Gothic,sans-serif">검증 → 처리 → 커밋</text></g><g><rect x="330" y="250" width="225" height="76" rx="11" fill="#fff" stroke="#cbd8c6"/><circle cx="351" cy="273" r="10" fill="#e8eed8"/><text x="351" y="277" text-anchor="middle" font-size="10" fill="#587046" font-family="Consolas,monospace">5</text><text x="370" y="278" fill="#223e3b" font-weight="600" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Deserializer</text><text x="350" y="305" fill="#6f8176" font-size="11" font-family="Segoe UI,Malgun Gothic,sans-serif">바이트 → JSON</text></g><g><rect x="650" y="250" width="225" height="76" rx="11" fill="#fff" stroke="#cbd8c6"/><circle cx="671" cy="273" r="10" fill="#e8eed8"/><text x="671" y="277" text-anchor="middle" font-size="10" fill="#587046" font-family="Consolas,monospace">6</text><text x="690" y="278" fill="#223e3b" font-weight="600" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Consumer poll</text><text x="670" y="305" fill="#6f8176" font-size="11" font-family="Segoe UI,Malgun Gothic,sans-serif">필요한 offset에서 읽기</text></g><text x="885" y="396" text-anchor="end" fill="#879587" font-family="Consolas,monospace" font-size="9">KAFKA FIELD GUIDE / CONCEPTUAL FLOW</text></svg>