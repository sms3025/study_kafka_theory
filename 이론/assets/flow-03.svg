<svg xmlns="http://www.w3.org/2000/svg" width="920" height="410" viewBox="0 0 920 410" role="img" aria-labelledby="title desc"><title id="title">Consumer Group · Rebalance 데이터 흐름</title><desc id="desc">orders · P0 → orders · P1 → orders · P2 → notify / Consumer A → notify / Consumer B → analytics 그룹. 알림 서비스 인스턴스 두 개는 group.id=notify로 실행합니다. 통계 서비스는 group.id=analytics로 실행합니다. notify 안에서는 분담하고, analytics는 주문 전체를 별도로 처리합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#758c80" stroke-width="1.5"/></marker><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dfe7dc"/></pattern></defs><rect width="920" height="410" fill="#f4f7ef"/><rect width="920" height="410" fill="url(#dots)"/><path d="M255 58.0 C292.5 58.0 292.5 103.0 330 103.0" fill="none" stroke="#8b9e8c" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M255 178.0 C292.5 178.0 292.5 103.0 330 103.0" fill="none" stroke="#8b9e8c" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M255 298.0 C292.5 298.0 292.5 283.0 330 283.0" fill="none" stroke="#8b9e8c" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M255 58.0 C452.5 58.0 452.5 178.0 650 178.0" fill="none" stroke="#8b9e8c" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="428.5" y="92.0" width="48" height="20" rx="4" fill="#f4f7ef"/><text x="452.5" y="106.0" text-anchor="middle" font-size="10" fill="#637c6a" font-family="Segoe UI,Malgun Gothic,sans-serif">독립 구독</text><path d="M255 298.0 C452.5 298.0 452.5 178.0 650 178.0" fill="none" stroke="#8b9e8c" stroke-width="1.7" marker-end="url(#arrow)"/><g><rect x="30" y="20" width="225" height="76" rx="11" fill="#182c30" stroke="#cbd8c6"/><circle cx="51" cy="43" r="10" fill="#e8eed8"/><text x="51" y="47" text-anchor="middle" font-size="10" fill="#587046" font-family="Consolas,monospace">1</text><text x="70" y="48" fill="#fff"