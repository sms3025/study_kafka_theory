<svg xmlns="http://www.w3.org/2000/svg" width="920" height="410" viewBox="0 0 920 410" role="img" aria-labelledby="title desc"><title id="title">Transactional Outbox 데이터 흐름</title><desc id="desc">주문 생성 → orders_db + outbox → Relay → 멱등 Consumer → orders / Kafka → published_at 갱신. 주문 API가 day10-order-0 주문을 받아 orders_db와 outbox에 함께 INSERT하고 커밋합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#758c80" stroke-width="1.5"/></marker><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dfe7dc"/></pattern></defs><rect width="920" height="410" fill="#f4f7ef"/><rect width="920" height="410" fill="url(#dots)"/><path d="M255 73.0 C292.5 73.0 292.5 73.0 330 73.0" fill="none" stroke="#8b9e8c" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="268.5" y="47.0" width="48" height="20" rx="4" fill="#f4f7ef"/><text x="292.5" y="61.0" text-anchor="middle" font-size="10" fill="#637c6a" font-family="Segoe UI,Malgun Gothic,sans-serif">동일 DB</text><path d="M555 73.0 C602.5 73.0 602.5 73.0 650 73.0" fill="none" stroke="#8b9e8c" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="578.5" y="47.0" width="48" height="20" rx="4" fill="#f4f7ef"/><text x="602.5" y="61.0" text-anchor="middle" font-size="10" fill="#637c6a" font-family="Segoe UI,Malgun Gothic,sans-serif">조회</text><path d="M650 73.0 C602.5 73.0 602.5 293.0 555 293.0" fill="none" stroke="#8b9e8c" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="578.5" y="157.0" width="48" height="20" rx="4" fill="#f4f7ef"/><text x="602.5" y="171.0" text-anchor="middle" font-size="10" fill="#637c6a" font-family="Segoe UI,Malgun Gothic,sans-serif">send</text><path d="M330 293.0 C292.5 293.0 292.5 293.0 255 293.0" fill="none" stroke="#8b9e8c" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="261.0" y="267.0" width="63" height="20" rx="4" fill="#f4f7ef"/><text x="292.5" y="281.0" text-anchor="middle" font-size="10" fill="#637c6a" font-family="Segoe UI,Malgun Gothic,sans-serif">consume</text><path d="M555 293.0 C602.5 293.0 602.5 293.0 650 293.0" fill="none" stroke="#8b9e8c" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="578.5" y="267.0" width="48" height="20" rx="4" fill="#f4f7ef"/><text x="602.5" y="281.0" text-anchor="middle" font-size="10" fill="#637c6a" font-family="Segoe UI,Malgun Gothic,sans-serif">실패 구간</text><g><rect x="30" y="35" width="225" height="76" rx="11" fill="#182c30" stroke="#cbd8c6"/><circle cx="51" cy="58" r="10" fill="#e8eed8"/><text x="51" y="62" text-anchor="middle" font-size="10" fill="#587046" font-family="Consolas,monospace">1</text><text x="70" y="63" fill="#fff" font-weight="600" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">주문 생성</text><text x="50" y="90" fill="#b2c6bb" font-size="11" font-family="Segoe UI,Malgun Gothic,sans-serif">DB BEGIN</text></g><g><rect x="330" y="35" width="225" height="76" rx="11" fill="#fff" stroke="#cbd8c6"/><circle cx="351" cy="58" r="10" fill="#e8eed8"/><text x="351" y="62" text-anchor="middle" font-size="10" fill="#587046" font-family="Consolas,monospace">2</text><text x="370" y="63" fill="#223e3b" font-weight="600" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">orders_db + outbox</text><text x="350" y="90" fill="#6f8176" font-size="11" font-family="Segoe UI,Malgun Gothic,sans-serif">하나의 DB COMMIT</text></g><g><rect x="650" y="35" width="225" height="76" rx="11" fill="#fff" stroke="#cbd8c6"/><circle cx="671" cy="58" r="10" fill="#e8eed8"/><text x="671" y="62" text-anchor="middle" font-size="10" fill="#587046" font-family="Consolas,monospace">3</text><text x="690" y="63" fill="#223e3b" font-weight="600" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">Relay</text><text x="670" y="90" fill="#6f8176" font-size="11" font-family="Segoe UI,Malgun Gothic,sans-serif">미발행 행 잠금</text></g><g><rect x="30" y="255" width="225" height="76" rx="11" fill="#fff" stroke="#cbd8c6"/><circle cx="51" cy="278" r="10" fill="#e8eed8"/><text x="51" y="282" text-anchor="middle" font-size="10" fill="#587046" font-family="Consolas,monospace">4</text><text x="70" y="283" fill="#223e3b" font-weight="600" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">멱등 Consumer</text><text x="50" y="310" fill="#6f8176" font-size="11" font-family="Segoe UI,Malgun Gothic,sans-serif">eventId로 중복 방지</text></g><g><rect x="330" y="255" width="225" height="76" rx="11" fill="#fff" stroke="#cbd8c6"/><circle cx="351" cy="278" r="10" fill="#e8eed8"/><text x="351" y="282" text-anchor="middle" font-size="10" fill="#587046" font-family="Consolas,monospace">5</text><text x="370" y="283" fill="#223e3b" font-weight="600" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">orders / Kafka</text><text x="350" y="310" fill="#6f8176" font-size="11" font-family="Segoe UI,Malgun Gothic,sans-serif">발행 ack</text></g><g><rect x="650" y="255" width="225" height="76" rx="11" fill="#fff" stroke="#cbd8c6"/><circle cx="671" cy="278" r="10" fill="#e8eed8"/><text x="671" y="282" text-anchor="middle" font-size="10" fill="#587046" font-family="Consolas,monospace">6</text><text x="690" y="283" fill="#223e3b" font-weight="600" font-size="14" font-family="Segoe UI,Malgun Gothic,sans-serif">published_at 갱신</text><text x="670" y="310" fill="#6f8176" font-size="11" font-family="Segoe UI,Malgun Gothic,sans-serif">ack 후 별도 DB COMMIT</text></g><text x="885" y="396" text-anchor="end" fill="#879587" font-family="Consolas,monospace" font-size="9">KAFKA FIELD GUIDE / CONCEPTUAL FLOW</text></svg>